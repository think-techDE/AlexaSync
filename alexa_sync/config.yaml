name: Alexa Sync
version: "0.9.12"
slug: alexa_sync
description: Synchronize the Alexa shopping list with a Home Assistant to-do list.
url: https://github.com/think-techDE/AlexaSync
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: true
ingress: true
ingress_port: 8099
ingress_panel: true
panel_icon: mdi:cart
options:
  amazon_domain: amazon.de
  ha_list: ""
  interval_seconds: 120
  sync_completed: true
  remove_completed: false
  log_level: info
schema:
  amazon_domain: str
  ha_list: str?
  interval_seconds: int(30,3600)
  sync_completed: bool
  remove_completed: bool
  log_level: list(trace|debug|info|warning|error)
