name: Alexa Sync
version: "0.3.0"
slug: alexa_sync
description: Bidirectional synchronization between two Home Assistant to-do lists.
url: https://github.com/think-techDE/AlexaSync
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
ingress_panel: true
panel_icon: mdi:cart-sync
options:
  list_a: ""
  list_b: ""
  mode: ha_todo_pair
  alexa_server_host: ""
  alexa_server_port: 4000
  ha_list: ""
  interval_seconds: 60
  sync_completed: true
  remove_completed: false
  log_level: info
schema:
  list_a: str?
  list_b: str?
  mode: list(ha_todo_pair|alexa_server)
  alexa_server_host: str?
  alexa_server_port: port
  ha_list: str?
  interval_seconds: int(10,3600)
  sync_completed: bool
  remove_completed: bool
  log_level: list(trace|debug|info|warning|error)
